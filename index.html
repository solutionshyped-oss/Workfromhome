  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue: #0876bd;
      --blue-light: #078fe1;
      --green: #20b44b;
      --text: #34414b;
      --muted: #7b909a;
    }

    body {
      min-height: 100vh;
      padding: 24px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle, rgba(255,255,255,.17) 4px, transparent 5px)
        0 0 / 48px 48px,
        linear-gradient(145deg, #0871b6, #087db7 40%, #0ca84c);
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 650px;
    }

    .card {
      width: 100%;
      padding: clamp(22px, 5vw, 42px);
      border-radius: 34px;
      background: #f8fcfd;
      border: 1px solid rgba(255,255,255,.85);
      box-shadow: 0 24px 70px rgba(0,42,69,.2);
      text-align: center;
    }

    .telegram-btn {
      width: 100%;
      min-height: 76px;
      padding: 17px 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      border-radius: 100px;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(105deg, var(--blue), var(--blue-light));
      box-shadow: 0 13px 28px rgba(0,126,198,.22);
      font-size: clamp(16px, 3.6vw, 23px);
      font-weight: 800;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .telegram-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 17px 32px rgba(0,126,198,.3);
    }

    .telegram-btn:focus-visible {
      outline: 4px solid #80d0ff;
      outline-offset: 4px;
    }

    .telegram-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 180px;
      height: 180px;
      margin: 34px auto 22px;
      border-radius: 50%;
      border: 5px solid white;
      background: #fff;
      box-shadow: 0 8px 26px rgba(30,62,78,.17),
                  inset 0 0 0 2px #dbe7ed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      color: #193c63;
    }

    .brand-mark::before {
      content: "";
      position: absolute;
      inset: 9px;
      border: 2px solid #193c63;
      border-radius: 50%;
    }

    .brand-mark svg {
      width: 66px;
      height: 54px;
      z-index: 1;
      margin-bottom: 4px;
    }

    .brand-name {
      z-index: 1;
      font-family: Georgia, serif;
      font-size: 20px;
      font-weight: bold;
      font-style: italic;
      letter-spacing: -1px;
    }

    .brand-subtitle {
      z-index: 1;
      margin-top: 5px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .8px;
    }

    h1 {
      color: var(--green);
      font-size: clamp(30px, 5.7vw, 43px);
      font-weight: 900;
      letter-spacing: -1.3px;
      line-height: 1.15;
    }

    .subtitle {
      margin: 14px 0 32px;
      color: var(--muted);
      font-size: clamp(14px, 3vw, 20px);
      font-weight: 800;
      letter-spacing: 3px;
    }

    .benefits {
      display: grid;
      gap: 20px;
      max-width: 540px;
      margin: 0 auto 32px;
      text-align: left;
    }

    .benefit {
      display: grid;
      grid-template-columns: 54px 1fr;
      align-items: center;
      gap: 15px;
      font-size: clamp(16px, 3.4vw, 21px);
      font-weight: 700;
      line-height: 1.45;
    }

    .check {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #20af4c;
      background: #eaf8ee;
      border: 1px solid #d3f0dc;
    }

    .check svg {
      width: 28px;
      height: 28px;
    }

    .notice {
      margin-bottom: 30px;
      padding: 22px 14px;
      border-radius: 22px;
      border: 1px solid #d5eaf7;
      background: #eef7fc;
      color: #1175b5;
      font-size: clamp(19px, 3.8vw, 25px);
      font-weight: 850;
      line-height: 1.45;
    }

    .notice span {
      display: block;
      color: #087744;
    }

    .note {
      margin: 26px 0 28px;
      color: #7d8b91;
      font-size: clamp(14px, 3vw, 18px);
      line-height: 1.65;
    }

    .note strong {
      color: #087744;
    }

    .managed {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px 20px;
      border: 1px solid #dce5e9;
      border-radius: 999px;
      background: #f4f7f8;
      color: #6c7a81;
      font-size: clamp(13px, 2.8vw, 17px);
      font-weight: 700;
    }

    .managed svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .managed b {
      color: #273943;
      letter-spacing: .3px;
    }

    @media (max-width: 420px) {
      body {
        padding: 14px 10px;
      }

      .card {
        padding: 20px 16px 24px;
        border-radius: 28px;
      }

      .telegram-btn {
        min-height: 64px;
        gap: 9px;
        padding: 14px 10px;
      }

      .telegram-icon {
        width: 27px;
        height: 27px;
      }

      .brand-mark {
        width: 155px;
        height: 155px;
        margin-top: 28px;
      }

      .brand-mark .brand-name {
        font-size: 18px;
      }

      .subtitle {
        letter-spacing: 2px;
        margin-bottom: 25px;
      }

      .benefits {
        gap: 16px;
      }

      .benefit {
        grid-template-columns: 44px 1fr;
        gap: 12px;
      }

      .check {
        width: 43px;
        height: 43px;
      }

      .check svg {
        width: 24px;
        height: 24px;
      }

      .notice {
        padding: 17px 10px;
      }

      .managed {
        padding: 12px 14px;
